          checked.size>0 && React.createElement("div", {style:{marginTop:22,padding:"14px 18px",background:"#0c0c14",border:"1px solid #1c1c2c",borderRadius:10}},
            React.createElement("div", {style:{fontSize:10,color:"#555",marginBottom:10,textTransform:"uppercase",letterSpacing:1.5,fontWeight:600}}, "Mission Behavioral Stack"),
            React.createElement("div", {style:{display:"flex",flexWrap:"wrap",gap:8}},
              stack.map(e=>
                React.createElement("div", {key:e.id, style:{background:"#0a140a",border:"1px solid #4ade80",borderRadius:20,padding:"3px 12px",fontSize:12,color:"#4ade80",display:"flex",alignItems:"center",gap:5}},
                  React.createElement("span", {style:{fontSize:10,color:"#3a6a3a"}}, "#"+e.id), e.name,
                  React.createElement("span", {onClick:ev=>toggle(e.id,ev), style:{cursor:"pointer",color:"#3a6a3a",fontSize:14,marginLeft:2}}, "×")
                )
              )
            )
          )
        )
      ),

      React.createElement("div", {style:{background:"#0c0c14",borderBottom:"1px solid #1c1c2c",padding:"14px 40px",position:"sticky",top:0,zIndex:100}},
        React.createElement("div", {style:{maxWidth:1300,margin:"0 auto",display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}},
          React.createElement("input", {value:search, onChange:e=>setSearch(e.target.value), placeholder:"Search effects, experiments, companies...",
            style:{background:"#0f0f18",border:"1px solid #1c1c2c",borderRadius:8,padding:"7px 13px",color:"#e0e0f0",fontSize:12.5,width:280}}),
          [{l:"Category",v:cat,s:setCat,o:categories},
           {l:"Phase",v:phase,s:setPhase,o:phases},
           {l:"Impact",v:impact,s:setImpact,o:impacts},
           {l:"Effort",v:effort,s:setEffort,o:effortLevels},
           {l:"Validation",v:val,s:setVal,o:validationTypes}
          ].map(f=>
            React.createElement("select", {key:f.l, value:f.v, onChange:e=>f.s(e.target.value),
              style:{background:"#0f0f18",border:"1px solid #1c1c2c",borderRadius:8,padding:"7px 11px",color:f.v==="All"?"#444":"#e0e0f0",fontSize:12,cursor:"pointer"}},
              f.o.map(o=>React.createElement("option", {key:o, value:o}, o==="All"?f.l+": All":o))
            )
          ),
          React.createElement("div", {style:{marginLeft:"auto",fontSize:11,color:"#444"}}, filtered.length+" effect"+(filtered.length!==1?"s":""))
        )
      ),

      React.createElement("div", {style:{maxWidth:1300,margin:"0 auto",padding:"30px 40px"}},
        categories.slice(1).map(c=>{
          const ce=filtered.filter(e=>e.category===c);
          if(!ce.length)return null;
          return React.createElement("div", {key:c, style:{marginBottom:44}},
            React.createElement("div", {style:{display:"flex",alignItems:"center",gap:10,marginBottom:18}},
              React.createElement("span", {style:{fontSize:18}}, categoryEmoji[c]),
              React.createElement("h2", {style:{fontFamily:"'Syne',sans-serif",fontSize:17,fontWeight:700,color:"#e0e0f0"}}, c),
              React.createElement("div", {style:{flex:1,height:1,background:"#1c1c2c",marginLeft:8}}),
              React.createElement("span", {style:{fontSize:11,color:"#444"}}, ce.length+" effects")
            ),
            React.createElement("div", {style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(360px,1fr))",gap:11}},
              ce.map(ef=>{
                const isExp=expandedId===ef.id,isChk=checked.has(ef.id),v=vc(ef.validationStatus),tab=getTab(ef.id);
                return React.createElement("div", {key:ef.id, className:"card"+(isExp?" exp":"")+(isChk?" chk":""),
                  onClick:()=>setExpandedId(isExp?null:ef.id),
                  style:{background:isChk?"#090e09":"#0c0c14",borderRadius:12,padding:"17px 19px",gridColumn:isExp?"1 / -1":"auto"}},

                  React.createElement("div", {style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12}},
                    React.createElement("div", {style:{flex:1,minWidth:0}},
                      React.createElement("div", {style:{display:"flex",alignItems:"center",gap:6,marginBottom:7,flexWrap:"wrap"}},
                        React.createElement("span", {style:{fontSize:10,color:"#3a3a4a",fontWeight:500}}, "#"+ef.id),
                        React.createElement("span", {style:{display:"inline-block",padding:"2px 9px",borderRadius:4,fontSize:10,fontWeight:700,background:v.bg,color:v.text,border:"1px solid "+v.border}},
                          v.icon+" "+ef.validationBadge)
                      ),
                      React.createElement("h3", {style:{fontSize:14.5,fontWeight:600,color:isChk?"#4ade80":"#e0e0f0",marginBottom:5,lineHeight:1.3}}, ef.name),
                      React.createElement("p", {style:{fontSize:12.5,color:"#777",lineHeight:1.55}}, ef.summary)
                    ),
                    React.createElement("button", {onClick:ev=>toggle(ef.id,ev), style:{width:30,height:30,borderRadius:8,flexShrink:0,background:isChk?"#4ade80":"#18182a",border:"2px solid "+(isChk?"#4ade80":"#2a2a3a"),color:isChk?"#000":"#555",fontSize:15,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}},
                      isChk?"✓":"+")
                  ),

                  React.createElement("div", {style:{display:"flex",flexWrap:"wrap",gap:4,marginTop:10}},
                    React.createElement("span", {style:{display:"inline-block",padding:"2px 8px",borderRadius:4,fontSize:10,fontWeight:600,background:impactColor[ef.impact]+"18",color:impactColor[ef.impact]}}, ef.impact+" Impact"),
                    React.createElement("span", {style:{display:"inline-block",padding:"2px 8px",borderRadius:4,fontSize:10,fontWeight:600,background:effortColor[ef.effort]+"18",color:effortColor[ef.effort]}}, ef.effort+" Effort"),
                    ef.phase.map(p=>React.createElement("span", {key:p, style:{display:"inline-block",padding:"2px 8px",borderRadius:4,fontSize:10,fontWeight:500,background:"#18182e",color:"#7b7bff"}}, p)),
                    ef.missionType.slice(0,3).map(m=>React.createElement("span", {key:m, style:{display:"inline-block",padding:"2px 8px",borderRadius:4,fontSize:10,fontWeight:500,background:"#1e1510",color:"#ff8c42"}}, m))
                  ),

                  isExp && React.createElement("div", {style:{marginTop:22,borderTop:"1px solid #1c1c2c",paddingTop:20}},
                    React.createElement("div", {style:{display:"flex",gap:6,marginBottom:20}},
                      [{k:"use",label:"How to Use"},{k:"exp",label:"🔬 Experiment"},{k:"rep",label:"🔁 Replication"},{k:"src",label:"📚 Source"},{k:"ind",label:"🏢 In the Wild"}].map(t=>
                        React.createElement("button", {key:t.k, className:"tab-btn"+(tab===t.k?" active":""), onClick:ev=>setTab(ef.id,t.k,ev)}, t.label)
                      )
                    ),

                    tab==="use" && React.createElement("div", {style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}},
                      React.createElement("div", null,
                        React.createElement("div", {style:{fontSize:10,color:"#444",textTransform:"uppercase",letterSpacing:1.5,marginBottom:8,fontWeight:700}}, "How to Use in Missions"),
                        React.createElement("p", {style:{fontSize:13,color:"#999",lineHeight:1.6}}, ef.howToUse)
                      ),
                      React.createElement("div", null,
                        React.createElement("div", {style:{fontSize:10,color:"#444",textTransform:"uppercase",letterSpacing:1.5,marginBottom:8,fontWeight:700}}, "Example Copy / Mechanic"),
                        React.createElement("div", {className:"xblock", style:{borderLeftColor:"#ff6b35",color:"#bbb",fontStyle:"italic"}}, ef.example)
                      )
                    ),

                    tab==="exp" && React.createElement("div", null,
                      React.createElement("div", {style:{fontSize:10,color:"#60a5fa",textTransform:"uppercase",letterSpacing:1.5,marginBottom:8,fontWeight:700}}, "Key Validating Experiment"),
                      React.createElement("div", {className:"xblock", style:{borderLeftColor:"#60a5fa",color:"#9db8d8"}}, ef.experiment)
                    ),

                    tab==="rep" && React.createElement("div", null,
                      React.createElement("div", {style:{fontSize:10,color:"#fbbf24",textTransform:"uppercase",letterSpacing:1.5,marginBottom:8,fontWeight:700}}, "Replication & Nuance"),
                      React.createElement("div", {className:"xblock", style:{borderLeftColor:"#fbbf24",color:"#c9a870"}}, ef.replicationNote)
                    ),

                    tab==="src" && React.createElement("div", null,
                      React.createElement("div", {style:{fontSize:10,color:"#a78bfa",textTransform:"uppercase",letterSpacing:1.5,marginBottom:8,fontWeight:700}}, "Academic Source"),
                      React.createElement("div", {className:"xblock", style:{borderLeftColor:"#a78bfa",color:"#9080b8",fontSize:12}}, ef.source),
                      React.createElement("div", {style:{marginTop:12,display:"flex",flexWrap:"wrap",gap:4}},
                        ef.missionType.map(m=>React.createElement("span", {key:m, style:{display:"inline-block",padding:"3px 9px",borderRadius:4,fontSize:11,background:"#1e1510",color:"#ff8c42"}}, m)),
                        React.createElement("span", {style:{display:"inline-block",padding:"3px 10px",borderRadius:6,fontSize:11,fontWeight:700,background:v.bg,color:v.text,border:"1px solid "+v.border,marginLeft:4}}, v.icon+" "+ef.validationBadge)
                      )
                    ),

                    tab==="ind" && React.createElement("div", null,
                      React.createElement("div", {style:{fontSize:10,color:"#fb923c",textTransform:"uppercase",letterSpacing:1.5,marginBottom:14,fontWeight:700}}, "How This Effect Is Used in Industry"),
                      React.createElement("div", {style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:10}},
                        ef.industryExamples.map((ex,i)=>
                          React.createElement("div", {key:i, className:"ind-card"},
                            React.createElement("div", {style:{display:"flex",alignItems:"center",gap:8,marginBottom:10}},
                              React.createElement("span", {style:{fontSize:20}}, ex.emoji),
                              React.createElement("span", {style:{fontSize:14,fontWeight:700,color:"#e0e0f0"}}, ex.company)
                            ),
                            React.createElement("p", {style:{fontSize:12.5,color:"#888",lineHeight:1.65}}, ex.how)
                          )
                        )
                      )
                    )
                  ),

                  React.createElement("div", {style:{marginTop:9,fontSize:10,color:"#2a2a3a"}}, isExp?"▲ collapse":"▼ expand")
                );
              })
            )
          );
        }),
        !filtered.length && React.createElement("div", {style:{textAlign:"center",padding:"80px 0",color:"#444"}},
          React.createElement("div", {style:{fontSize:36,marginBottom:14}}, "🔍"),
          React.createElement("div", {style:{fontSize:15}}, "No effects match your filters")
        )
      ),

      React.createElement("div", {style:{borderTop:"1px solid #1c1c2c",padding:"20px 40px",background:"#080810",textAlign:"center"}},
        React.createElement("p", {style:{fontSize:11,color:"#2a2a3a"}}, "34 peer-reviewed effects · Experiment · Replication · Source · Industry Examples · Talabat Missions Framework")
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
